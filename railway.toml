# CP5 — Cấu hình deploy Railway (dùng nếu bạn chọn Railway).
#
# Các biến môi trường KHÔNG khai báo ở đây. Đặt chúng trong dashboard hoặc:
#     railway variables --set AGENT_API_KEY=...
#
# Railway tự gán biến PORT — app phải đọc $PORT, đừng cố định 8000.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Không đặt startCommand: với builder Dockerfile, Railway chạy lệnh này không
# qua shell nên `$PORT` không được nội suy. CMD trong Dockerfile đã dùng
# `sh -c "exec uvicorn ... --port ${PORT:-8000}"` để đọc đúng cổng Railway gán.
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
