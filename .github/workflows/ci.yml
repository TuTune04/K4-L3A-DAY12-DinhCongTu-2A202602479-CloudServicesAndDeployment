# CI/CD: mỗi lần push/PR vào main → test + build image trên máy sạch.
# Chỉ khi cả hai xanh VÀ là push lên main → deploy lên Railway rồi smoke test.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Push liên tiếp thì hủy lần chạy cũ, tránh 2 lần deploy chồng nhau
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (CP1–CP4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Bỏ test_cp5 (gọi vào bản deploy đang sống) và test_bonus_cicd (tự kiểm
      # tra badge của chính workflow này). Test build Docker (-m docker) để cho
      # job build lo.
      - name: Run pytest
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: "fake://"
        run: >
          pytest tests/ -v -m "not docker"
          --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker build
        run: docker build -t day12-agent:${{ github.sha }} .

      - name: Image size
        run: docker images day12-agent:${{ github.sha }} --format '{{.Size}}'

  deploy:
    name: Deploy to Railway
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.62.1

      # RAILWAY_TOKEN là Project Token (Railway → Project Settings → Tokens),
      # cất trong GitHub → Settings → Secrets and variables → Actions
      - name: railway up
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service day12-agent --ci

      - name: Smoke test
        env:
          # URL public, không phải secret → Variables; chưa đặt thì dùng mặc định
          PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://day12-agent-production-1b0f.up.railway.app' }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "$PUBLIC_URL/health"; then
              echo
              curl -fsS "$PUBLIC_URL/ready"
              exit 0
            fi
            sleep 10
          done
          echo "service không phản hồi sau deploy" >&2
          exit 1
